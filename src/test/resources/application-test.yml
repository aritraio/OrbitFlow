spring:
  application:
    name: orbitflow-test
  datasource:
    url: jdbc:h2:mem:orbitflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # H2 has no pgcrypto; migrations must be portable (see V1/V2 using portable SQL)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
  mail:
    host: localhost
    port: 1025
  quartz:
    job-store-type: memory
    auto-startup: false

orbitflow:
  jwt:
    secret: test-only-256-bit-secret-test-only-256-bit-secret-0123456789abcdef
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
  s3:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: testtest
    bucket: orbitflow-test
    region: us-east-1
  mail:
    from: "OrbitFlow Test <no-reply@test.local>"

logging:
  level:
    com.orbitflow: INFO
    org.hibernate.SQL: WARN
